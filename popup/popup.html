<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperShield AdBlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-group">
        <div class="shield-icon">
          <img src="../icons/icon48.png" alt="SuperShield" class="header-logo-img" width="30" height="30">
        </div>
        <div class="title-wrap">
          <h1>SuperShield</h1>
          <span id="status-badge" class="badge active">PROTECTED</span>
        </div>
      </div>
      <div class="toggle-wrap">
        <label class="switch">
          <input type="checkbox" id="toggle-switch">
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Quick Action Tools for Streaming & Custom Blocking -->
    <section class="tools-section">
      <button id="btn-force-play" class="tool-btn force-play-btn" title="Remove overlays and start video immediately">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">ปลดล็อกวิดีโอ (Force Play)</span>
      </button>

      <button id="btn-picker" class="tool-btn picker-btn" title="Pick and block any element on this page">
        <span class="btn-icon">🎯</span>
        <span class="btn-text">เลือกบล็อกเอง (Element Picker)</span>
      </button>
    </section>

    <section class="metrics-grid">
      <div class="card">
        <div class="card-icon">🚫</div>
        <div class="card-data">
          <span id="banners-count" class="counter">0</span>
          <span class="label">Banners (หน้านี้)</span>
          <span class="sub-counter">ทั้งหมด: <span id="banners-total">0</span></span>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">⚡</div>
        <div class="card-data">
          <span id="videos-count" class="counter">0</span>
          <span class="label">Videos (หน้านี้)</span>
          <span class="sub-counter">ทั้งหมด: <span id="videos-total">0</span></span>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">🔓</div>
        <div class="card-data">
          <span id="defused-count" class="counter">0</span>
          <span class="label">Defused (หน้านี้)</span>
          <span class="sub-counter">ทั้งหมด: <span id="defused-total">0</span></span>
        </div>
      </div>
    </section>

    <!-- Site Specific Custom Rules & Stats Info -->
    <div id="site-rules-bar" class="site-rules-bar">
      <span>กฎบนเว็บนี้: <strong id="site-rules-count">0</strong></span>
      <button id="btn-clear-rules" class="btn-clear" style="display: none;">ล้างกฎ</button>
      <button id="btn-reset-stats" class="btn-reset" title="รีเซ็ตสถิติสะสมทั้งหมดกลับเป็น 0">ล้างสถิติ</button>
    </div>

    <footer class="footer">
      <span>Auto-skip & Stealth Active</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
