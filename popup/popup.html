<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperShield AdBlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-group">
        <div class="shield-icon">
          <img src="../icons/icon48.png" alt="SuperShield" class="header-logo-img" width="30" height="30">
        </div>
        <div class="title-wrap">
          <h1>SuperShield</h1>
          <span id="status-badge" class="badge active">PROTECTED</span>
        </div>
      </div>
      <div class="toggle-wrap">
        <label class="switch">
          <input type="checkbox" id="toggle-switch">
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Quick Action Tools for Streaming & Custom Blocking -->
    <section class="tools-section">
      <button id="btn-force-play" class="tool-btn force-play-btn" title="Remove overlays and start video immediately">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">Force Play</span>
      </button>

      <button id="btn-picker" class="tool-btn picker-btn" title="Pick and block any element on this page">
        <span class="btn-icon">🎯</span>
        <span class="btn-text">Element Picker</span>
      </button>
    </section>

    <section class="metrics-grid">
      <div class="card">
        <div class="card-icon">🚫</div>
        <div class="card-data">
          <span id="banners-count" class="counter">0</span>
          <span class="label">Blocked</span>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">⚡</div>
        <div class="card-data">
          <span id="videos-count" class="counter">0</span>
          <span class="label">Videos Skipped</span>
        </div>
      </div>

      <div class="card">
        <div class="card-icon">🔓</div>
        <div class="card-data">
          <span id="defused-count" class="counter">0</span>
          <span class="label">Defused Detection</span>
        </div>
      </div>
    </section>

    <!-- Site Specific Custom Rules Info -->
    <div id="site-rules-bar" class="site-rules-bar">
      <span>Rules on this site: <strong id="site-rules-count">0</strong></span>
      <button id="btn-clear-rules" class="btn-clear" style="display: none;">Clear Rules</button>
    </div>

    <!-- Custom Blocklists & Subscriptions Panel -->
    <section class="custom-section">
      <button id="btn-toggle-custom-panel" class="custom-accordion-btn" type="button">
        <div class="accordion-left">
          <span class="accordion-icon">🛡️</span>
          <span class="accordion-title">Custom Rules & Lists</span>
        </div>
        <div class="accordion-right">
          <span id="custom-total-badge" class="badge-mini">0</span>
          <span id="custom-panel-arrow" class="accordion-arrow">▸</span>
        </div>
      </button>

      <div id="custom-panel-body" class="custom-panel-body" style="display: none;">
        <!-- Multi-line Rules Card -->
        <div class="custom-subcard">
          <div class="subcard-header">
            <span class="subcard-title">Custom Rules (one per line)</span>
            <span id="custom-user-count" class="subcard-count">0 rules</span>
          </div>
          <textarea id="custom-rules-textarea" class="custom-textarea" rows="4" placeholder="example-tracker.com&#10;||bad-ads.net^&#10;0.0.0.0 popup-ad.org&#10;movie44.com##.full"></textarea>
          <div class="action-row">
            <button id="btn-save-custom-rules" class="btn-action btn-primary" type="button">Save Rules</button>
            <button id="btn-clear-custom-rules" class="btn-action btn-secondary" type="button">Clear</button>
          </div>
          <div id="custom-rules-feedback" class="feedback-msg"></div>
        </div>

        <!-- Subscription URL Card -->
        <div class="custom-subcard">
          <div class="subcard-header">
            <span class="subcard-title">Subscribe to List URL</span>
          </div>
          <div class="input-action-row">
            <input type="url" id="subscription-url-input" class="custom-input" placeholder="https://raw.githubusercontent.com/.../list.txt" />
            <button id="btn-add-subscription" class="btn-action btn-primary" type="button">Add</button>
          </div>
          <div id="sub-feedback" class="feedback-msg"></div>

          <!-- Subscription List items -->
          <div id="subscriptions-container" class="subscriptions-container"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>Auto-skip & Stealth Active</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
